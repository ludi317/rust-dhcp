[package]
name = "dhcp-client"
version = "0.2.0"
edition = "2021"

[dependencies]
log = "0.4"
tokio = { version = "1.0", features = ["full"] }
eui48 = "1.1"
hostname = "0.4"
rand = "0.10.1"
dhcp-protocol = { path = "../protocol" }
dhcp-framed = { path = "../framed" }
arp = { path = "../arp" }
thiserror = "2.0.18"
env_logger = "0.11"
libc = "0.2"
ipnetwork = "0.21.1"
dhcproto = "0.15"
socket2 = "0.6.4"
[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.21.0"
futures = "0.3.31"
netlink-packet-route = "0.31.0"

