// Minimal Kea DHCPv6 server config for manually testing rust-dhcp --ipv6.
//
// Replace "veth0" with the interface Kea should listen on inside your test
// netns / veth setup. A single /64 pool is advertised with a short 60s lease
// so T1/T2 renewal can be observed within a minute.
//
// DNS option 23 (dns-servers) and option 24 (domain-search) are populated so
// rust-dhcp's DNS handling can be verified.
//
// Run with:
//   sudo kea-dhcp6 -c tests/fixtures/kea-dhcp6.conf

{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": [ "veth0" ]
    },
    "lease-database": {
      "type": "memfile",
      "lfc-interval": 3600,
      "name": "/tmp/kea-leases6.csv"
    },
    "preferred-lifetime": 30,
    "valid-lifetime": 60,
    "renew-timer": 20,
    "rebind-timer": 40,
    "option-data": [
      {
        "name": "dns-servers",
        "data": "2001:db8::53, 2001:db8::54"
      },
      {
        "name": "domain-search",
        "data": "example.test, lab.example.test"
      }
    ],
    "subnet6": [
      {
        "id": 1,
        "subnet": "2001:db8:1::/64",
        "interface": "veth0",
        "pools": [
          { "pool": "2001:db8:1::100-2001:db8:1::1ff" }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp6",
        "severity": "DEBUG",
        "debuglevel": 50,
        "output_options": [ { "output": "stdout" } ]
      }
    ]
  }
}
